name: 🐞 Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte prüfe vorher mit `/mrpvp debug`, ob der Spieler zur Quote zählt
        (häufigste Ursache: LuckPerms-Wildcard `*` enthält `mrpvp.exempt`).
  - type: input
    id: version
    attributes:
      label: MRpvp-Version
      description: Ausgabe von `/mrpvp version`
      placeholder: "0.9.4"
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server-Version
      description: Ausgabe von `/version`
      placeholder: "Paper 26.3 Build 200"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet, was ist stattdessen passiert?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. /time set 13000
        2. Spieler A legt sich hin
        3. ...
  - type: textarea
    id: logs
    attributes:
      label: Konsole / /mrpvp debug
      description: Relevante Konsolenausgabe oder Ausgabe von `/mrpvp debug`.
      render: text
  - type: textarea
    id: config
    attributes:
      label: Geänderte Config-Werte (optional)
      description: Nur die Werte, die du gegenüber dem Standard geändert hast. Keine Webhook-URL posten!
      render: yaml
