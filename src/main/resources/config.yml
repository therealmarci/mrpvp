# ==============================================================================
#   MRpvp - Konfiguration
# ==============================================================================
#   Nach Änderungen:  /mrpvp reload   (kein Neustart nötig)
#   Im Spiel läuft alles über die Menüs: /duel
#
#   Texte & Nachrichten: lang/de.yml bzw. lang/en.yml.
#   Daten (Spiele, gesicherte Inventare, Statistik): plugins/MRpvp/mrpvp.db (SQLite).
#
#   Diese Datei ist UTF-8-kodiert. Falls Umlaute (ä, ö, ü) falsch angezeigt werden,
#   im Editor die Kodierung auf "UTF-8" stellen.
# ==============================================================================

# Nicht ändern - wird für automatische Config-Updates verwendet.
config-version: 6

# Sprache der Texte (Menüs, Nachrichten). Die Texte stehen in plugins/MRpvp/lang/<sprache>.yml.
#   auto = jeder Spieler bekommt die Sprache, die er in Minecraft eingestellt hat.
#          Deutsch (auch Österreich/Schweiz) -> de.yml, alle anderen -> fallback-language.
#   de / en / ... = feste Sprache für alle Spieler.
# Die Konsole ist immer Englisch. Eigene Sprache: Datei kopieren (z.B. fr.yml) und übersetzen.
language: auto

# Sprache für Spieler, deren Minecraft-Sprache keine eigene Datei hat.
fallback-language: en


# ------------------------------------------------------------------------------
#   1) ARENA-WELT & ARENEN
# ------------------------------------------------------------------------------
# MRpvp legt die Welt beim ersten Start selbst an (leere Void-Welt) und setzt ihre Regeln bei jedem Start:
# keine Mobs, kein Tag/Nacht-Wechsel, kein Wetter, keine Advancement-/Todesnachrichten, PvP an.
# Ein Welt-Manager wie Multiverse ist nicht nötig - falls einer läuft, die Welt dort nicht verwalten lassen.
arena-world:
  # Ordnername der Welt. Eine Änderung gilt erst nach einem Neustart (die alte Welt bleibt liegen).
  name: mrpvp_arenas
  # easy, normal oder hard. "peaceful" geht nicht - dort würden Spieler im Kampf ständig heilen.
  difficulty: normal
  # Feste Tageszeit in Ticks: 0 = Morgen, 6000 = Mittag, 13000 = Abend, 18000 = Mitternacht.
  time: 6000


arenas:
  # Wie viele Arenen pro Vorlage fertig aufgebaut bereitstehen (für neue Vorlagen; pro Arena im Admin-Menü
  # änderbar). Ein Duell startet dann ohne Wartezeit und ohne Lag. 0 = erst beim Duell aufbauen.
  pool-per-template: 1
  # Höchstens so viele Arenen gleichzeitig (alle Vorlagen zusammen) - mehr Duelle warten.
  max-slots: 32
  # Abstand zwischen zwei Arenen in Blöcken (damit man sich nicht sieht).
  spacing: 1000
  # Größte Arena, die der Editor speichert (Breite x/z und Höhe). Größere Arenen brauchen beim Aufbauen
  # spürbar mehr Zeit auf einmal - bis 64 x 48 x 64 ist unkritisch.
  max-width: 64
  max-height: 48
  # Luft über einer Arena, die Spieler nutzen dürfen (Elytra, Streitkolben) - wer höher fliegt, wird
  # zurückgesetzt. Höchstens 200 (Bauhöhe der Welt).
  headroom: 150


# ------------------------------------------------------------------------------
#   2) DUELLE
# ------------------------------------------------------------------------------
duel:
  # So lange bleibt eine Einladung offen (Sekunden).
  invite-seconds: 30
  # Wartezeit zwischen zwei Einladungen desselben Spielers (Sekunden). Ohne Wartezeit: mrpvp.bypass.cooldown
  invite-cooldown-seconds: 10
  # Countdown vor dem Kampf (Sekunden, Spieler sind solange eingefroren). 0 = sofort.
  countdown-seconds: 3
  # Was Spieler beim Herausfordern einstellen können (Menü nach der Kit-Auswahl).
  options:
    # Siege bis Gewinn ("first to"): Auswahl und Vorgabe. 1 = eine Runde.
    wins: [1, 2, 3, 5]
    default-wins: 1
    # Zeitlimit pro Runde in Minuten - danach unentschieden.
    minutes: [3, 5, 10, 15]
    default-minutes: 10
    # Vorgaben für Hunger und natürliche Regeneration. Kits können sie festlegen (z.B. UHC ohne Regeneration).
    default-hunger: true
    default-regen: true
  # Pause nach dem Ende, bevor beide ihre Sachen zurückbekommen (Sekunden).
  end-delay-seconds: 3
  # Verliert ein Spieler mitten im Duell die Verbindung (Absturz, Server verlassen), wartet die Runde so lange auf
  # ihn (Sekunden) - der Gegner ist solange eingefroren. Kommt er zurück, geht es mit dem Countdown weiter. Das geht
  # nur einmal pro Match und Spieler; danach (oder ohne Rückkehr) hat er verloren. 0 = sofort verloren.
  # Aufgeben (/duel leave) ist immer eine Niederlage - außer im Countdown vor der ersten Runde.
  reconnect-seconds: 20
  # Darf ein Totem der Unsterblichkeit im Kit einen Spieler retten? false = er zählt als besiegt.
  totems: true
  # Befehle, die im Duell erlaubt sind (ohne "/"). /duel geht immer (Aufgeben).
  # Alle anderen sind gesperrt - damit sich niemand mit /home, /spawn oder /tpa herausrettet.
  # Ausnahme für Admins: mrpvp.bypass.commands
  allowed-commands:
    - msg
    - tell
    - w
    - r
    - reply
    - report
    - sc


# ------------------------------------------------------------------------------
#   3) STATISTIK
# ------------------------------------------------------------------------------
# Eigene Duell-Statistik (K/D, Siege, Serien, Bestenliste) - völlig getrennt von der Minecraft-Statistik.
stats:
  # Kürzere Runden ohne einen einzigen Treffer sind auffällig (Sekunden) - siehe review.hold "short".
  min-duration-seconds: 10
  # Mehr Runden gegen denselben Gegner innerhalb von 24 Stunden sind auffällig (Statistik-Farmen) - review.hold "limit".
  # 0 = keine Grenze.
  max-counted-per-opponent-per-day: 5
  # Wer mitten im Kampf den Server verlässt, bekommt einen Tod.
  quit-counts-as-death: true
  # Wer aufgibt, bekommt einen Tod.
  surrender-counts-as-death: true
  # Wer den Gegner aus der Arena stößt, bekommt einen Kill.
  border-counts-as-kill: true
  # K/D und Siegquote erscheinen in der Bestenliste erst ab so vielen Runden.
  min-games-for-ratio: 10


# Auffällige Runden zählen nicht einfach nicht - sie warten, bis ein Admin entscheidet (Admin-Menü → Prüfen,
# MRadmin-Web → MRpvp → Prüfen). Bis dahin zählen sie nicht; "werten" nimmt sie nachträglich in die Statistik auf.
review:
  # Was eine Runde zur Prüfung zurückhält:
  #   farming = dieselben zwei Spieler sehr oft hintereinander (monitor.same-pair-per-hour)
  #   limit   = mehr als stats.max-counted-per-opponent-per-day Runden gegen denselben Gegner an einem Tag
  #   short   = kürzer als stats.min-duration-seconds und dabei kein einziger Treffer
  #   hit     = ein einzelner Treffer stärker als monitor.max-hit-hearts
  #   border  = sehr oft versucht, die Arena zu verlassen (monitor.border-tries)
  #   idle    = lange Runde ganz ohne Treffer (monitor.idle-seconds)
  #   quit    = jemand hat mitten im Kampf den Server verlassen
  # Nicht aufgeführte werden nur gemeldet (Überwachung), die Runde zählt normal.
  hold: [farming, limit, short, hit, border, idle]
  # Nach so vielen Tagen ohne Entscheidung wird automatisch entschieden.
  auto-days: 7
  # count = dann zählt sie, discard = dann zählt sie nie, none = sie wartet, bis ein Admin entscheidet.
  auto-decision: count
  # Admins online (Recht mrpvp.admin.review) bekommen eine Nachricht, wenn eine Runde wartet - und beim Betreten
  # des Servers, wie viele warten.
  notify: true


# ------------------------------------------------------------------------------
#   4) SCHUTZ
# ------------------------------------------------------------------------------
protection:
  # Advancements in der Arena-Welt gar nicht erst vergeben (z.B. durch Kit-Rüstung) - kein Toast, keine Meldung.
  revoke-advancements: true
  # Minecraft-Statistik (Schaden, Sprünge, gelaufene Blöcke ...) nach der Runde auf den Stand davor setzen.
  # Tode und Kills zählen sowieso nie - im Duell stirbt niemand wirklich.
  restore-statistics: true


# ------------------------------------------------------------------------------
#   5) VERLAUF
# ------------------------------------------------------------------------------
history:
  # Kampf-Log, Positionen (Mini-Karte) und Inventar beim Ende so viele Tage aufheben.
  days: 30
  # Gesicherte Inventare (Stand beim Betreten) so viele Tage aufheben. Noch nicht zurückgegebene werden nie gelöscht.
  # Die Runden selbst (Ergebnis, Zahlen) bleiben für die Statistik immer erhalten.
  snapshot-days: 90


# ------------------------------------------------------------------------------
#   6) ÜBERWACHUNG
# ------------------------------------------------------------------------------
# Auffällige Runden: im Admin-Menü, in MRadmin (Server-Zustand, Weboberfläche) und - wenn gewünscht - im
# Discord-Admin-Log von MRadmin. Sie werden 24 Stunden gemerkt.
monitor:
  enabled: true
  # Zusätzlich ins Discord-Admin-Log von MRadmin (auch Runden, die auf Prüfung warten; nur wenn MRadmin installiert
  # und dort Discord eingerichtet ist).
  discord: true
  # So viele Runden derselben zwei Spieler innerhalb einer Stunde = Verdacht auf Statistik-Farmen.
  same-pair-per-hour: 6
  # Ein einzelner Treffer mit mindestens so vielen Herzen Schaden (Streitkolben ausgenommen - der darf das).
  max-hit-hearts: 20
  # So viele Versuche, in einer Runde die Arena zu verlassen.
  border-tries: 10
  # Eine Runde, die mindestens so lange dauert, ohne dass irgendwer trifft (Sekunden).
  idle-seconds: 90
  # Wer mitten im Kampf den Server verlässt, wird immer gemeldet.


# ------------------------------------------------------------------------------
#   7) UPDATES
# ------------------------------------------------------------------------------
update-checker:
  enabled: true
  # Quelle: "github" (GitHub Releases, Standard) oder "modrinth"
  source: github
  # Auch Beta-/Alpha-Versionen melden. Läuft selbst eine Vorabversion (0.x), werden sie immer gemeldet.
  include-prereleases: false
  interval-hours: 6
  # Spieler mit "mrpvp.admin.update" beim Betreten des Servers informieren.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   8) MENÜS
# ------------------------------------------------------------------------------
gui:
  # Wie oft offene Menüs aktualisiert werden (in Ticks, 20 = 1 Sekunde).
  refresh-ticks: 20
  # Klick-Sounds in den Menüs.
  sounds: true
