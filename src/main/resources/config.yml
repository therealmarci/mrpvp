# ==============================================================================
#   MRpvp - Configuration
# ==============================================================================
#   After changes:   /mrpvp reload   (no restart needed)
#   In game everything runs through the menus: /duel
#   Help & docs:     https://mrtechnology.marcelr.at/docs/mrpvp/
#
#   Texts & messages: lang/de.yml or lang/en.yml.
#   Data (games, saved inventories, statistics): plugins/MRpvp/mrpvp.db (SQLite).
#
#   This file is UTF-8 encoded. If special characters (ä, ö, ü) look wrong,
#   set the encoding in your editor to "UTF-8".
# ==============================================================================

# Do not change - used for automatic config updates.
config-version: 7

# Language of the texts (menus, messages). The texts are in plugins/MRpvp/lang/<language>.yml.
#   auto = every player gets the language set in their Minecraft client.
#          German (also Austria/Switzerland) -> de.yml, everything else -> fallback-language.
#   de / en / ... = fixed language for all players.
# The console is always English. Own language: copy a file (e.g. as fr.yml) and translate it.
language: auto

# Language for players whose Minecraft language has no file of its own.
fallback-language: en


# ------------------------------------------------------------------------------
#   1) ARENA WORLD & ARENAS
# ------------------------------------------------------------------------------
# MRpvp creates the world itself on first start (empty void world) and sets its rules on every start:
# no mobs, no day/night cycle, no weather, no advancement/death messages, PvP on.
# A world manager like Multiverse is not needed - if one is running, do not let it manage this world.
arena-world:
  # Folder name of the world. A change only applies after a restart (the old world stays where it is).
  name: mrpvp_arenas
  # easy, normal or hard. "peaceful" does not work - players would keep healing during the fight.
  difficulty: normal
  # Fixed time of day in ticks: 0 = morning, 6000 = noon, 13000 = evening, 18000 = midnight.
  time: 6000


arenas:
  # How many arenas per template stand ready, already built (for new templates; changeable per arena in the
  # admin menu). A duel then starts without waiting and without lag. 0 = build only when the duel starts.
  pool-per-template: 1
  # At most this many arenas at the same time (all templates together) - further duels wait.
  max-slots: 32
  # Distance between two arenas in blocks (so players cannot see each other).
  spacing: 1000
  # Largest arena the editor saves (width x/z and height). Bigger arenas take noticeably more time
  # at once when being built - up to 64 x 48 x 64 is fine.
  max-width: 64
  max-height: 48
  # Air above an arena players may use (elytra, mace) - whoever flies higher is
  # reset. At most 200 (build height of the world).
  headroom: 150


# ------------------------------------------------------------------------------
#   2) DUELS
# ------------------------------------------------------------------------------
duel:
  # How long an invite stays open (seconds).
  invite-seconds: 30
  # Waiting time between two invites of the same player (seconds). Without waiting time: mrpvp.bypass.cooldown
  invite-cooldown-seconds: 10
  # Countdown before the fight (seconds, players are frozen meanwhile). 0 = immediately.
  countdown-seconds: 3
  # What players can set when challenging (menu after picking the kit).
  options:
    # Wins needed ("first to"): choices and default. 1 = one round.
    wins: [1, 2, 3, 5]
    default-wins: 1
    # Time limit per round in minutes - after that it is a draw.
    minutes: [3, 5, 10, 15]
    default-minutes: 10
    # Defaults for hunger and natural regeneration. Kits can fix them (e.g. UHC without regeneration).
    default-hunger: true
    default-regen: true
  # Pause after the end before both get their things back (seconds).
  end-delay-seconds: 3
  # If a player loses the connection in the middle of a duel (crash, leaving the server), the round waits this long
  # for them (seconds) - the opponent is frozen meanwhile. If they come back, it continues with the countdown. This
  # works once per match and player; after that (or without returning) they have lost. 0 = lost immediately.
  # Giving up (/duel leave) is always a loss - except during the countdown before the first round.
  reconnect-seconds: 20
  # May a totem of undying in the kit save a player? false = they count as defeated.
  totems: true
  # Commands allowed during a duel (without "/"). /duel always works (giving up).
  # All others are blocked - so nobody escapes with /home, /spawn or /tpa.
  # Exception for admins: mrpvp.bypass.commands
  allowed-commands:
    - msg
    - tell
    - w
    - r
    - reply
    - report
    - sc


# ------------------------------------------------------------------------------
#   3) STATISTICS
# ------------------------------------------------------------------------------
# Separate duel statistics (K/D, wins, streaks, leaderboard) - completely apart from the Minecraft statistics.
stats:
  # Shorter rounds without a single hit are suspicious (seconds) - see review.hold "short".
  min-duration-seconds: 10
  # More rounds against the same opponent within 24 hours are suspicious (statistic farming) - review.hold "limit".
  # 0 = no limit.
  max-counted-per-opponent-per-day: 5
  # Whoever leaves the server in the middle of a fight gets a death.
  quit-counts-as-death: true
  # Whoever gives up gets a death.
  surrender-counts-as-death: true
  # Whoever knocks the opponent out of the arena gets a kill.
  border-counts-as-kill: true
  # K/D and win rate only appear in the leaderboard after this many rounds.
  min-games-for-ratio: 10


# Suspicious rounds do not simply not count - they wait until an admin decides (admin menu → Review,
# MRadmin web → MRpvp → Review). Until then they do not count; "count" adds them to the statistics afterwards.
review:
  # What holds a round back for review:
  #   farming = the same two players very often in a row (monitor.same-pair-per-hour)
  #   limit   = more than stats.max-counted-per-opponent-per-day rounds against the same opponent in one day
  #   short   = shorter than stats.min-duration-seconds and not a single hit
  #   hit     = a single hit stronger than monitor.max-hit-hearts
  #   border  = very often tried to leave the arena (monitor.border-tries)
  #   idle    = long round without any hit (monitor.idle-seconds)
  #   quit    = someone left the server in the middle of the fight
  # Reasons not listed are only reported (monitoring), the round counts normally.
  hold: [farming, limit, short, hit, border, idle]
  # After this many days without a decision, it is decided automatically.
  auto-days: 7
  # count = then it counts, discard = then it never counts, none = it waits until an admin decides.
  auto-decision: count
  # Online admins (permission mrpvp.admin.review) get a message when a round is waiting - and, when joining
  # the server, how many are waiting.
  notify: true


# ------------------------------------------------------------------------------
#   4) PROTECTION
# ------------------------------------------------------------------------------
protection:
  # Do not grant advancements in the arena world at all (e.g. from kit armour) - no toast, no message.
  revoke-advancements: true
  # Reset the Minecraft statistics (damage, jumps, blocks walked ...) to their state before the round.
  # Deaths and kills never count anyway - nobody really dies in a duel.
  restore-statistics: true


# ------------------------------------------------------------------------------
#   5) HISTORY
# ------------------------------------------------------------------------------
history:
  # Keep the combat log, positions (mini map) and the inventory at the end for this many days.
  days: 30
  # Keep saved inventories (state when entering) for this many days. Ones not yet returned are never deleted.
  # The rounds themselves (result, numbers) are always kept for the statistics.
  snapshot-days: 90


# ------------------------------------------------------------------------------
#   6) MONITORING
# ------------------------------------------------------------------------------
# Suspicious rounds: in the admin menu, in MRadmin (server status, web interface) and - if wanted - in
# MRadmin's Discord admin log. They are remembered for 24 hours.
monitor:
  enabled: true
  # Also send them to MRadmin's Discord admin log (including rounds waiting for review; only if MRadmin is
  # installed and Discord is set up there).
  discord: true
  # This many rounds of the same two players within one hour = suspected statistic farming.
  same-pair-per-hour: 6
  # A single hit with at least this many hearts of damage (except the mace - it may do that).
  max-hit-hearts: 20
  # This many attempts to leave the arena in one round.
  border-tries: 10
  # A round lasting at least this long without anybody hitting (seconds).
  idle-seconds: 90
  # Whoever leaves the server in the middle of a fight is always reported.


# ------------------------------------------------------------------------------
#   7) UPDATES
# ------------------------------------------------------------------------------
update-checker:
  enabled: true
  # Source: "github" (GitHub Releases, default) or "modrinth"
  source: github
  # Also report beta/alpha versions. If a pre-release (0.x) is running, they are always reported.
  include-prereleases: false
  interval-hours: 6
  # Notify players with "mrpvp.admin.update" when they join the server.
  notify-on-join: true


# ------------------------------------------------------------------------------
#   8) MENUS
# ------------------------------------------------------------------------------
gui:
  # How often open menus are refreshed (in ticks, 20 = 1 second).
  refresh-ticks: 20
  # Click sounds in the menus.
  sounds: true
