# ==============================================================================
#   MRpvp - Kits
# ==============================================================================
#   What players get in a duel. After changes: /mrpvp reload
#   Easier: edit kits in game with the kit editor (admin menu → Kits) - it writes this file.
#
#   Per kit:
#     name         display name (MiniMessage)
#     icon         item in the selection menu
#     description  lines below the name in the menu
#     permission   empty = everyone with mrpvp.use, otherwise e.g. "mrpvp.kit.netherite"
#     items        slot -> item
#     rules        (optional) what the kit changes about the round:
#                    damage: false     hits deal no damage, only knockback (Sumo, Boxing)
#                    hits-to-win: 100  whoever lands this many hits first wins (Boxing)
#                    regen: false      natural regeneration fixed on/off (otherwise the players choose)
#                    hunger: false     hunger fixed on/off (otherwise the players choose)
#                    arenas: [sumo]    only in these arenas
#                    build: true       needs an arena where building is allowed
#
#   Slots: 0-8 = hotbar, 9-35 = inventory, helmet, chestplate, leggings, boots, offhand
#
#   Item:
#     type          material (https://jd.papermc.io/paper/org/bukkit/Material.html)
#     amount        amount (default 1)
#     enchantments  enchantment: level, e.g. { sharpness: 2, unbreaking: 3 }
#     name          own name (MiniMessage), optional
#     unbreakable   true = never breaks
#     potion        for potions / arrows: potion type, e.g. strong_healing, swiftness, long_fire_resistance
#     data          (from the kit editor) the complete item as Base64 - replaces everything above
#
#   Deleted default kits do not come back by themselves: admin menu → "Restore defaults".
# ==============================================================================

