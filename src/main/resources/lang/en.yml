# ==============================================================================
#   MRpvp - language file: English (en)
# ==============================================================================
#   With "language: auto" in config.yml, players whose Minecraft language has no own file get this one.
#   Own language: copy this file (e.g. as fr.yml) and translate it.
#   Missing texts are added automatically on updates - your changes are kept.
#
#   Format: MiniMessage - https://docs.advntr.dev/minimessage/format.html
#   Empty text ("") = the message is not sent.
# ==============================================================================

# Do not change - tells the plugin which texts to renew on updates.
