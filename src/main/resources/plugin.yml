name: MRpvp
version: '${version}'
main: at.marcelr.mrpvp.MRPvp
api-version: '${mcVersion}'
softdepend: [MRadmin, MRtoolbar, MRsleep]
# SQLite driver for plugins/MRpvp/mrpvp.db - Paper downloads it on the first start (folder libraries/).
libraries:
  - org.xerial:sqlite-jdbc:${sqliteVersion}
author: _therealmarci
website: ${website}/docs/${websiteSlug}/
description: Duels in dedicated arenas - invites, kits, own statistics, nothing counts towards the vanilla statistics.

commands:
  duel:
    description: Opens the duel menu (with a player name directly the invite to this player).
    usage: /duel [player]
    aliases: [pvp, duell]
  mrpvp:
    description: Management of MRpvp for the console (in game everything runs through the menus).
    usage: /mrpvp <version|reload|debug>

permissions:
  # ------------------------------------------------------------------ Groups
  # The same in every MRtechnology plugin: <plugin>.player for players, <plugin>.groups.support / staff / admin for
  # the team - each group contains the one below. The single permissions further down stay usable on their own;
  # mrpvp.bypass.commands and the kit permissions from kits.yml are in no group on purpose.
  mrpvp.player:
    description: "Player: duels - open /duel, challenge and accept invites."
    default: op
    children:
      mrpvp.use: true
  mrpvp.groups.support:
    description: "Group support: player + admin menu, view all rounds (results, combat log, saved inventories), review suspicious rounds, watch duels, player management."
    default: op
    children:
      mrpvp.player: true
      mrpvp.admin.gui: true
      mrpvp.admin.games: true
      mrpvp.admin.review: true
      mrpvp.admin.spectate: true
      mrpvp.admin.players: true
  mrpvp.groups.staff:
    description: "Group staff: support + edit kits and arenas, stop duels or declare the winner, pause duels, ban players from duels."
    default: op
    children:
      mrpvp.groups.support: true
      mrpvp.admin.kits: true
      mrpvp.admin.arena: true
      mrpvp.admin.stop: true
      mrpvp.admin.pause: true
      mrpvp.admin.ban: true
  mrpvp.groups.admin:
    description: "Group admin: everything of MRpvp - reset statistics, return saved states, restore defaults, reload, debug, update notice, no invite cooldown."
    default: op
    children:
      mrpvp.groups.staff: true
      mrpvp.admin.reset: true
      mrpvp.admin.restore: true
      mrpvp.admin.defaults: true
      mrpvp.admin.reload: true
      mrpvp.admin.debug: true
      mrpvp.admin.update: true
      mrpvp.bypass.cooldown: true

  # ------------------------------------------------------------------ Single permissions
  mrpvp.use:
    description: Duels - open /duel, challenge and accept invites. Kits with their own permission (kits.yml "permission") need it additionally.
    default: op
  mrpvp.bypass.cooldown:
    description: No waiting time between two invites.
    default: op
  mrpvp.bypass.commands:
    description: All commands also during a duel (otherwise only duel.allowed-commands).
    default: false
  mrpvp.admin.gui:
    description: Open the admin menu (/duel admin or the button in the duel menu). Actions in it need their own permission.
    default: op
  mrpvp.admin.arena:
    description: Manage arenas - build new arenas, edit them (editor in creative mode), activate, pool, delete.
    default: op
  mrpvp.admin.games:
    description: View all games - results, combat log and the saved inventories (when entering and at the end).
    default: op
  mrpvp.admin.restore:
    description: Return a still open saved state immediately (replaces the player's current inventory).
    default: op
  mrpvp.admin.spectate:
    description: Watch running duels in spectator mode (admin menu -> Live).
    default: op
  mrpvp.admin.stop:
    description: Cancel running duels (they do not count, both get everything back) or declare the winner.
    default: op
  mrpvp.admin.pause:
    description: Pause running duels (both frozen, nobody takes damage, the time stands) and resume them.
    default: op
  mrpvp.admin.kits:
    description: Edit, create and delete kits in the kit editor.
    default: op
  mrpvp.admin.players:
    description: Open the player management in the admin menu.
    default: op
  mrpvp.admin.ban:
    description: Ban players from duels and lift bans.
    default: op
  mrpvp.admin.reset:
    description: Reset a player's duel statistics.
    default: op
  mrpvp.admin.review:
    description: Review suspicious rounds - count or discard them (admin menu -> Review, MRadmin web). Also gets the notices about them.
    default: op
  mrpvp.admin.defaults:
    description: Restore default kits and default arenas.
    default: op
  mrpvp.admin.reload:
    description: /mrpvp reload
    default: op
  mrpvp.admin.debug:
    description: /mrpvp debug - test saving/returning the state and view saved states.
    default: op
  mrpvp.admin.update:
    description: Notice when joining the server if an update is available.
    default: op
